services:
  db:
    image: postgres:16-alpine
    container_name: smart-mandi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_mandi
      POSTGRES_USER: smart_mandi
      POSTGRES_PASSWORD: change_this_local_password
    ports:
      - "5433:5432"
    volumes:
      - smart_mandi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_mandi -d smart_mandi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  smart_mandi_pgdata:
